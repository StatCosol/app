<div class="flex" [class.justify-end]="isOutgoing">
  <div
    class="max-w-[80%] rounded-xl px-4 py-3"
    [class.bg-brand-50]="isOutgoing"
    [class.bg-gray-50]="!isOutgoing"
    [class.border]="true"
    [class.border-brand-100]="isOutgoing"
    [class.border-gray-200]="!isOutgoing"
  >
    <!-- Sender + timestamp -->
    <div class="flex items-center gap-2 mb-1.5 text-xs text-gray-500">
      <span
        class="font-medium"
        [class.text-brand-700]="isOutgoing"
        [class.text-gray-700]="!isOutgoing"
      >
        {{ msg.senderName || msg.senderRole }}
      </span>
      <span class="text-gray-400">·</span>
      <span>{{ msg.createdAt | date: 'short' }}</span>
    </div>

    <!-- Message body -->
    <div class="text-sm text-gray-900 whitespace-pre-wrap break-words">{{ msg.message }}</div>

    <!-- Attachments -->
    @if (msg.attachments?.length) {
      <div class="mt-2 pt-2 border-t border-gray-200 space-y-1">
        @for (a of msg.attachments; track $index) {
          <ui-thread-attachment
            [url]="a.url"
            [fileName]="a.name"
            [contextId]="msg.id"
          ></ui-thread-attachment>
        }
      </div>
    }
  </div>
</div>
