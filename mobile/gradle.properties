# Project-wide Gradle properties for statcompy-attendance
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
statco.adminExitPin=247365

# KSP1, deliberately. KSP 2.x defaults to KSP2, which cannot process Room 2.6.1:
#   e: [ksp] java.lang.IllegalStateException: unexpected jvm signature V
# The alternative is bumping Room, and Room is the kiosk's OFFLINE PUNCH store —
# not something to move in the same change as a Kotlin major bump. Room stays on
# 2.6.1 and KSP falls back to KSP1, which processes it fine.
# Revisit together: bump Room to 2.7.x and drop this flag, in its own change with
# offline sync tested on a device.
ksp.useKSP2=false
