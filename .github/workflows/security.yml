name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (backend + frontend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit locked production dependencies
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-${{ matrix.project }}
          path: ${{ matrix.project }}/npm-audit.json

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install semgrep
      - name: Scan first-party source
        run: semgrep scan --config p/security-audit --error --metrics=off --json --output semgrep.json --sarif-output semgrep.sarif backend/src frontend/src face-svc/app mobile/app/src mobile/essportal/src
      - name: Publish Semgrep findings
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: .github/workflows/security.yml:semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: |
            semgrep.json
            semgrep.sarif

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install standalone Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      # The baseline holds the eight findings already committed to this public
      # repository's history between 2026-02-01 and 2026-03-13. They cannot be
      # recalled, so they are remediated by revoking the credentials at source,
      # tracked in docs/security/leaked-credentials.md, not by rewriting git.
      # Baselining them is what lets this job fail on anything NEW: a secret
      # added from here on has a different fingerprint and breaks the build.
      - name: Scan history (redacted)
        run: >-
          gitleaks git --baseline-path .gitleaks-baseline.json
          --redact --report-format json --report-path gitleaks.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks
          path: gitleaks.json

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        run: >-
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.74.0 fs
          --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1
          --format json --output /workspace/trivy-fs.json /workspace
      - name: Convert Trivy findings to SARIF
        if: ${{ !cancelled() && hashFiles('trivy-fs.json') != '' }}
        run: docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.74.0 convert --format sarif --output /workspace/trivy-fs.sarif /workspace/trivy-fs.json
      - name: Publish filesystem findings
        if: ${{ !cancelled() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: .github/workflows/security.yml:trivy-fs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-filesystem
          path: |
            trivy-fs.json
            trivy-fs.sarif

  trivy-images:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build scan target
        run: docker build -t scan-target:${{ github.sha }} ./${{ matrix.name }}
      - name: Trivy image scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/workspace"
          aquasec/trivy:0.74.0 image --severity HIGH,CRITICAL --exit-code 1
          --format json --output /workspace/trivy-image.json scan-target:${{ github.sha }}
      - name: Convert image findings to SARIF
        if: ${{ !cancelled() && hashFiles('trivy-image.json') != '' }}
        run: docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.74.0 convert --format sarif --output /workspace/trivy-image.sarif /workspace/trivy-image.json
      - name: Publish image findings
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          # Match the original matrix category so stale alerts can be reconciled.
          category: .github/workflows/security.yml:trivy-images/context:${{ matrix.name }}/dockerfile:${{ matrix.name }}/Dockerfile/name:${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-${{ matrix.name }}
          path: |
            trivy-image.json
            trivy-image.sarif

  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
          category: .github/workflows/security.yml:codeql
          output: codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql
          path: codeql-results
