name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      payroll: ${{ steps.filter.outputs.payroll }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            payroll:
              - 'backend/src/payroll/**'
              - 'backend/migrations/**'
              - 'backend/scripts/**'
              - 'backend/package.json'
              - 'backend/package-lock.json'
              - 'paydek_transition_smoke.ps1'
              - 'full_smoke.ps1'
              - '.github/workflows/ci.yml'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --passWithNoTests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx ng build --configuration=production

      - name: Unit tests
        run: npm run test -- --watch=false

  payroll-transition-smoke:
    runs-on: ubuntu-latest
    needs: [changes, backend]
    if: needs.changes.outputs.payroll == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statcompy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d statcompy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: statcompy
      JWT_SECRET: statcompy_ci_secret_key_1234567890
      NODE_ENV: test
      EMAIL_ENABLED: "false"
      SKIP_BOOTSTRAP_SEED: "true"
      ALLOW_MISSING_TABLES: "true"
      SMOKE_ADMIN_EMAIL: it_admin@statcosol.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generate smoke admin password
        run: |
          password="$(openssl rand -base64 24 | tr -d '\n' | tr '/+' 'AB')"
          echo "DEFAULT_SEED_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SMOKE_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SEED_CEO_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Apply SQL migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: statcompy
          PGPASSWORD: postgres
        run: |
          # Apply baseline schema FIRST so the `roles`, `users`, etc. tables
          # exist before the obsolete migrations seed into them.
          if [ -f migrations/statco_schema_final.sql ]; then
            echo "Applying baseline migrations/statco_schema_final.sql"
            psql -h localhost -p 5432 -U postgres -d statcompy \
              -v ON_ERROR_STOP=1 -f migrations/statco_schema_final.sql
          fi

          # Apply early obsolete migration that creates legacy tables
          # (e.g. contractor_employees) which later DATED migrations
          # depend on. Must run AFTER baseline (needs `roles`) and
          # BEFORE dated migrations.
          if [ -f migrations/obsolete/20260127_hrms_phase1_schema.sql ]; then
            echo "Applying migrations/obsolete/20260127_hrms_phase1_schema.sql"
            psql -h localhost -p 5432 -U postgres -d statcompy \
              -v ON_ERROR_STOP=1 -f migrations/obsolete/20260127_hrms_phase1_schema.sql
          fi

          # Use the cross-platform migration runner so CI mirrors prod and
          # automatically picks up every chronologically-ordered SQL file
          # (all migrations are idempotent: CREATE/ADD ... IF NOT EXISTS).
          # Baseline is re-checked via checksum and skipped if unchanged.
          # `|| true` mirrors the production Dockerfile CMD which tolerates
          # legacy-migration interdependency failures (boot patches in
          # main.ts heal the gaps); the smoke test below catches real
          # regressions via live API calls.
          npm run db:migrate:sql || true

          # Apply LATE obsolete migration that ALTERs tables created by
          # dated migrations (e.g. employee_nominations from
          # 20260217_payroll_statutory_engine.sql). Must run AFTER the
          # cross-platform runner has applied those dated migrations.
          if [ -f migrations/obsolete/20260220_ess_employee_self_service.sql ]; then
            echo "Applying migrations/obsolete/20260220_ess_employee_self_service.sql"
            psql -h localhost -p 5432 -U postgres -d statcompy \
              -v ON_ERROR_STOP=1 -f migrations/obsolete/20260220_ess_employee_self_service.sql
          fi

          psql -h localhost -p 5432 -U postgres -d statcompy \
            -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE users
            ADD COLUMN IF NOT EXISTS user_type VARCHAR(10),
            ADD COLUMN IF NOT EXISTS employee_id UUID,
            ADD COLUMN IF NOT EXISTS scheduled_employment VARCHAR(120),
            ADD COLUMN IF NOT EXISTS last_login_at TIMESTAMPTZ;
          CREATE INDEX IF NOT EXISTS idx_users_user_type ON users(user_type);
          CREATE INDEX IF NOT EXISTS idx_users_employee_id ON users(employee_id);
          -- Ensure entity columns added by failed-and-rolled-back migrations
          -- still exist (e.g. 20260505b rolls back when leave_balances insert
          -- fails, which un-applies the sl_accrual_divisor ADD COLUMN).
          ALTER TABLE IF EXISTS payroll_client_setup
            ADD COLUMN IF NOT EXISTS sl_accrual_divisor numeric(6,2) NOT NULL DEFAULT 60;
          SQL

      - name: Seed baseline roles/users
        run: npm run seed:baseline
        working-directory: backend

      - name: Start backend (prod)
        run: |
          set -x
          npm run build
          ls -la dist/src/main.js
          node --version
          # Start the backend in the background. Stream output to a log
          # file the next step can poll. We deliberately skip an in-process
          # warm-up to avoid the port-3000 release race that delays the
          # background instance binding.
          nohup node dist/src/main.js > ../backend_ci.log 2>&1 &
          echo $! > ../backend_ci.pid
          echo "--- launched pid $(cat ../backend_ci.pid) ---"
          sleep 3
          ps -p "$(cat ../backend_ci.pid)" -o pid,stat,cmd || echo "process already exited"
        working-directory: backend

      - name: Wait for health
        run: |
          for i in {1..120}; do
            if curl -sf http://localhost:3000/api/health >/dev/null || curl -sf http://localhost:3000/api/v1/health >/dev/null; then
              echo "Backend is healthy (after $((i*2))s)"
              exit 0
            fi
            if [ -f backend_ci.log ] && grep -q "Nest application successfully started" backend_ci.log; then
              echo "Backend started (health endpoint probe unavailable), continuing to smoke test"
              exit 0
            fi
            # Diagnostic: dump log tail every 30s
            if [ $((i % 15)) -eq 0 ] && [ -f backend_ci.log ]; then
              echo "--- backend_ci.log tail @ $((i*2))s ---"
              tail -n 40 backend_ci.log || true
              echo "--- /backend_ci.log tail ---"
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          if [ -f backend_ci.log ]; then
            echo "--- backend_ci.log (full) ---"
            cat backend_ci.log || true
          fi
          # Check if the backend process is still alive
          if [ -f backend_ci.pid ]; then
            pid="$(cat backend_ci.pid)"
            echo "--- backend pid=$pid status ---"
            ps -p "$pid" -o pid,ppid,stat,cmd || echo "process not running"
            ps -ef | grep -E "node|nest" | grep -v grep || true
          fi
          exit 1

      - name: Run PayDek transition smoke
        shell: pwsh
        run: ./paydek_transition_smoke.ps1 -BaseUrl "http://localhost:3000/api" -AdminEmail "$env:SMOKE_ADMIN_EMAIL" -AdminPassword "$env:SMOKE_ADMIN_PASSWORD" -OutFile "$PWD/paydek_transition_results_ci.txt"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paydek-transition-smoke
          path: |
            paydek_transition_results_ci.txt
            backend_ci.log

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend_ci.pid ]; then
            kill "$(cat backend_ci.pid)" || true
          fi

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t statcompy-backend ./backend

      - name: Build frontend image
        run: docker build -t statcompy-frontend ./frontend
