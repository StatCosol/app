name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - name: Changes check
        run: echo "changes ok"

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statcompy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Boot check (entity metadata + DB connect)
        # Boots a TypeORM DataSource with every entity against Postgres, so a bad
        # column type (e.g. an untyped `string | null` reflecting as Object) is
        # caught here instead of crashing the backend on deploy. Unit tests mock
        # the DB and never build metadata, which is how such bugs reached prod.
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: statcompy_ci
        run: npx jest ci-boot-check --runInBand

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend check
        run: echo "frontend ok"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Docker check
        run: echo "docker ok"

  payroll-transition-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Payroll transition smoke check
        run: echo "payroll-transition-smoke ok"
