name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - name: Changes check
        run: echo "changes ok"

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: statcompy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint:check
      - name: Deep module check
        run: npm run deep-module-check
      - name: Module checker regressions
        run: node --test scripts/deep-module-check.test.js scripts/deployment-gate.test.js scripts/release-checks.test.cjs
      - name: Local smoke script safety regressions
        shell: pwsh
        run: ../scripts/test-auditxpert-smoke.ps1
      - name: Unit tests
        run: npm test
      - name: Intern payroll migration regressions
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/statcompy_ci
        run: |
          node scripts/validate-intern-payroll-cycle.cjs
          node -r ts-node/register scripts/validate-payroll-period-lock.cjs
      - name: Automation PostgreSQL regressions
        env:
          AUTOMATION_TEST_PORT: 5432
          AUTOMATION_TEST_USER: postgres
          AUTOMATION_TEST_PASSWORD: postgres
          AUTOMATION_TEST_DATABASE: statcompy_ci
        run: |
          npm run build
          node scripts/validate-client-branch-db.cjs
          node scripts/validate-critical-workflows-db.cjs
          node scripts/validate-module-gap-db.cjs
          node scripts/validate-operational-scope.cjs
          node scripts/validate-deep-list-review.cjs
          node scripts/validate-automation-controls.cjs
          node scripts/validate-automation-dedup.cjs
          node scripts/validate-my-work.cjs
          node scripts/validate-ui-automation-upgrade.cjs
          node scripts/validate-contractor-payroll-authority.cjs
          node scripts/validate-payroll-document-reconciliation.cjs
          node scripts/validate-deeper-business-flows.cjs
          node scripts/validate-notice-checklist-options.cjs
          node scripts/validate-endpoint-role-options.cjs
          node -r ts-node/register scripts/test-monthly-close-db.js
          node scripts/test-payroll-reconciliation-db.js
          node scripts/validate-nomination-repair.cjs
          node scripts/validate-clra-scope.cjs
          node scripts/validate-contractor-punch-list.cjs
          node scripts/validate-report-queries.cjs
      - name: Audit correction and report governance PostgreSQL regressions
        env:
          AUDITXPERT_TEST_PORT: 5432
          AUDITXPERT_TEST_USER: postgres
          AUDITXPERT_TEST_PASSWORD: postgres
        run: |
          node scripts/verify-audit-corrections.cjs
          node scripts/verify-audit-follow-ups.cjs
          node scripts/verify-invoice-delivery.cjs
          node scripts/verify-audit-entry.cjs ./auditxpert-test-db.cjs
          node scripts/verify-auditor-dashboard.cjs ./auditxpert-test-db.cjs
          node scripts/verify-payslip-layout-db.cjs
          node scripts/verify-register-generation-time-db.cjs
      - name: Helpdesk PostgreSQL regressions
        env:
          AUDITXPERT_TEST_PORT: 5432
          AUDITXPERT_TEST_USER: postgres
          AUDITXPERT_TEST_PASSWORD: postgres
        run: node scripts/verify-helpdesk-db.cjs
      - name: Patched dependency runtime smoke
        run: node scripts/security-dependency-smoke.cjs
      - name: Billing transaction PostgreSQL regressions
        env:
          AUDITXPERT_TEST_PORT: 5432
          AUDITXPERT_TEST_USER: postgres
          AUDITXPERT_TEST_PASSWORD: postgres
        run: node scripts/verify-billing-transactions.cjs
      - name: Consolidated permission and report PostgreSQL regressions
        env:
          AUDITXPERT_TEST_PORT: 5432
          AUDITXPERT_TEST_USER: postgres
          AUDITXPERT_TEST_PASSWORD: postgres
        run: node scripts/verify-consolidated-scope-db.cjs
      - name: AI audit reference PostgreSQL regressions
        env:
          AUDITXPERT_TEST_PORT: 5432
          AUDITXPERT_TEST_USER: postgres
          AUDITXPERT_TEST_PASSWORD: postgres
        run: node scripts/verify-ai-audit-references-db.cjs
      - name: AI payroll anomaly integrity PostgreSQL regressions
        env:
          AUDITXPERT_TEST_PORT: 5432
          AUDITXPERT_TEST_USER: postgres
          AUDITXPERT_TEST_PASSWORD: postgres
        run: node scripts/verify-ai-payroll-anomalies-db.cjs
      - name: Payslip PDF layout regressions
        run: node scripts/verify-payslip-layout.cjs
      - name: Boot check (entity metadata + DB connect)
        # Boots a TypeORM DataSource with every entity against Postgres, so a bad
        # column type (e.g. an untyped `string | null` reflecting as Object) is
        # caught here instead of crashing the backend on deploy. Unit tests mock
        # the DB and never build metadata, which is how such bugs reached prod.
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: statcompy_ci
        run: npx jest ci-boot-check --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Portal option and menu inventory
        run: node puppeteer-tests/option-inventory.cjs
      - name: ESS native session bridge regressions
        run: node scripts/validate-ess-session-bridge.cjs
        working-directory: .
      - name: Unit tests (Vitest service specs)
        run: npm run test:unit
      - name: Install Chromium for browser tests
        # ubuntu-latest already includes Chromium's runtime libraries. Avoid
        # `--with-deps`, which can hang indefinitely when the Azure apt mirror
        # is unavailable and prevent every required downstream check.
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Unit tests (Angular TestBed suite)
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        # Validates backend/Dockerfile (multi-stage build + nest build in the
        # container) so a broken Dockerfile fails here, not at deploy.
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: statcompy-frontend-ci:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Verify non-root frontend runtime
        run: |
          docker run -d --name frontend-smoke -p 127.0.0.1:18080:8080 \
            -e BACKEND_URL=http://127.0.0.1:3000 statcompy-frontend-ci:${{ github.sha }}
          trap 'docker logs frontend-smoke; docker rm -f frontend-smoke' EXIT
          test "$(docker exec frontend-smoke id -u)" != "0"
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz && curl -fsS http://127.0.0.1:18080/app/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  face-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inference safety regressions
        working-directory: face-svc
        run: |
          pip install -r requirements-test.txt
          python -m unittest discover -s tests -v

  payroll-transition-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Payroll transition smoke check
        working-directory: backend
        run: npx jest --runInBand --runTestsByPath src/payroll/payroll-approval.service.spec.ts src/payroll/payroll-configuration-scope.guard.spec.ts src/payroll/reconciliation/payroll-reconciliation.service.spec.ts
