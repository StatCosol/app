name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - name: Changes check
        run: echo "changes ok"

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Backend check
        run: echo "backend ok"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend check
        run: echo "frontend ok"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Docker check
        run: echo "docker ok"
