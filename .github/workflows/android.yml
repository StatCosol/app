name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Roster crypto JVM tests
        working-directory: mobile
        run: bash gradlew :app:testKioskDebugUnitTest --no-daemon
      - name: Android APK check
        working-directory: mobile
        run: bash gradlew :app:assembleKioskDebug :essportal:assembleDebug --no-daemon
