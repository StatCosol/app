name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}   # lets you build on demand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Generate the Gradle wrapper on the fly so we don't have to ship the
      # wrapper jar binary in git.
      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # Optional: download the MobileFaceNet TFLite model from a private URL
      # held in the repo secret MOBILEFACENET_TFLITE_URL. If the secret is not
      # set the build still succeeds; the resulting APK installs and launches
      # but face matching is a no-op until the asset is provided.
      - name: Fetch MobileFaceNet model
        env:
          MODEL_URL: ${{ secrets.MOBILEFACENET_TFLITE_URL }}
        run: |
          if [ -n "$MODEL_URL" ]; then
            mkdir -p app/src/main/assets
            curl -fsSL "$MODEL_URL" -o app/src/main/assets/mobilefacenet.tflite
            echo "Model fetched ($(stat -c%s app/src/main/assets/mobilefacenet.tflite) bytes)"
          else
            echo "MOBILEFACENET_TFLITE_URL secret not set — building without model asset."
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: statcompy-attendance-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
